name: Check sources

on:
  schedule:
    # Февраль–октябрь: раз в неделю (понедельник, 06:00 UTC = 12:00 Бишкек)
    - cron: "0 6 * 2-10 1"
    # Ноябрь–январь: каждый день
    - cron: "0 6 * 11,12,1 *"
  workflow_dispatch:
    inputs:
      source:
        description: "id источника из data/sources.json (пусто = все)"
        required: false
        default: ""
      force:
        description: "Вызвать LLM, даже если страница не изменилась"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE: ${{ inputs.source }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          if [ -n "$SOURCE" ]; then ARGS+=(--source "$SOURCE"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          python agent/check_sources.py "${ARGS[@]}"

      - name: Commit results
        run: |
          git config user.name "admission-agent"
          git config user.email "admission-agent@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "agent: проверка источников $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
