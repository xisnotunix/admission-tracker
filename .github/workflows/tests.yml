name: Tests

on:
  push:
    paths: ["agent/**", "tests/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      - run: python -m unittest discover tests -v
